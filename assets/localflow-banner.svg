<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title description">
  <title id="title">LocalFlow — private voice to text</title>
  <desc id="description">The LocalFlow mark rests in a black square, slides left into a white listening bar, reveals eight live speech bars, then returns to its resting state.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfcfa"/>
      <stop offset="1" stop-color="#f1f1ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#111111" flood-opacity=".16"/>
    </filter>
    <filter id="barShadow" x="-40%" y="-30%" width="180%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#111111" flood-opacity=".22"/>
    </filter>
  </defs>

  <!-- Brand surface -->
  <rect width="1200" height="360" fill="url(#surface)"/>
  <rect x="28" y="26" width="1144" height="308" rx="30" fill="none" stroke="#111111" stroke-opacity=".1"/>
  <path d="M72 223H466" stroke="#111111" stroke-opacity=".14"/>

  <!-- LocalFlow wordmark, matched to the supplied black brand treatment -->
  <text x="72" y="104" fill="#111111" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3.2">LOCAL VOICE SYSTEM</text>
  <text x="70" y="171" fill="#111111" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-4">LocalFlow</text>
  <text x="74" y="207" fill="#4d4d4a" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500">Press. Speak. Watch your words flow.</text>
  <g transform="translate(72 249)">
    <circle cx="7" cy="7" r="5" fill="#111111">
      <animate attributeName="opacity" values="1;.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="23" y="12" fill="#111111" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.9">100% ON-DEVICE</text>
  </g>

  <!--
    The idle mark begins as a black square. During the listening phase it expands
    left into a white bar; the mark travels left and exposes the live speech bars.
  -->
  <g filter="url(#shadow)">
    <rect x="840" y="108" width="112" height="112" rx="24" fill="#151914" stroke="#151914" stroke-width="1">
      <animate attributeName="x" values="840;840;590;590;840;840" dur="5.6s" repeatCount="indefinite" keyTimes="0;.17;.29;.79;.91;1" calcMode="spline" keySplines=".72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1"/>
      <animate attributeName="width" values="112;112;362;362;112;112" dur="5.6s" repeatCount="indefinite" keyTimes="0;.17;.29;.79;.91;1" calcMode="spline" keySplines=".72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1"/>
      <animate attributeName="rx" values="24;24;16;16;24;24" dur="5.6s" repeatCount="indefinite" keyTimes="0;.17;.29;.79;.91;1" calcMode="spline" keySplines=".72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1"/>
      <animate attributeName="fill" values="#151914;#151914;#ffffff;#ffffff;#151914;#151914" dur="5.6s" repeatCount="indefinite" keyTimes="0;.17;.29;.79;.91;1" calcMode="spline" keySplines=".72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1"/>
      <animate attributeName="stroke" values="#151914;#151914;#d3d3ce;#d3d3ce;#151914;#151914" dur="5.6s" repeatCount="indefinite" keyTimes="0;.17;.29;.79;.91;1" calcMode="spline" keySplines=".72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1"/>
    </rect>
  </g>

  <!-- LocalFlow wave-mark -->
  <g fill="none" stroke="#fffaf1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-250 0;-250 0;0 0;0 0" dur="5.6s" repeatCount="indefinite" keyTimes="0;.17;.29;.79;.91;1" calcMode="spline" keySplines=".72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1"/>
    <animate attributeName="stroke" values="#fffaf1;#fffaf1;#151914;#151914;#fffaf1;#fffaf1" dur="5.6s" repeatCount="indefinite" keyTimes="0;.17;.29;.79;.91;1" calcMode="spline" keySplines=".72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1;.72 0 .28 1"/>
    <!-- The exact AudioWaveform path from lucide-react, scaled for the banner. -->
    <path transform="translate(870 138) scale(2.2)" d="M2 13a2 2 0 0 0 2-2V7a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0V4a2 2 0 0 1 4 0v13a2 2 0 0 0 4 0v-4a2 2 0 0 1 2-2"/>
  </g>

  <!-- Speech waveform, revealed only while the capsule is open -->
  <g fill="#151914" filter="url(#barShadow)">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="5.6s" repeatCount="indefinite" keyTimes="0;.22;.32;.77;.86;1"/>
    <rect x="732" y="156" width="14" height="16" rx="7" opacity=".48">
      <animate attributeName="height" values="16;42;16" dur=".72s" repeatCount="indefinite"/>
      <animate attributeName="y" values="156;143;156" dur=".72s" repeatCount="indefinite"/>
    </rect>
    <rect x="758" y="146" width="14" height="36" rx="7" opacity=".72">
      <animate attributeName="height" values="36;66;36" dur=".72s" begin="-.09s" repeatCount="indefinite"/>
      <animate attributeName="y" values="146;131;146" dur=".72s" begin="-.09s" repeatCount="indefinite"/>
    </rect>
    <rect x="784" y="132" width="14" height="64" rx="7">
      <animate attributeName="height" values="64;92;64" dur=".72s" begin="-.31s" repeatCount="indefinite"/>
      <animate attributeName="y" values="132;118;132" dur=".72s" begin="-.31s" repeatCount="indefinite"/>
    </rect>
    <rect x="810" y="145" width="14" height="38" rx="7" opacity=".74">
      <animate attributeName="height" values="38;70;38" dur=".72s" begin="-.18s" repeatCount="indefinite"/>
      <animate attributeName="y" values="145;129;145" dur=".72s" begin="-.18s" repeatCount="indefinite"/>
    </rect>
    <rect x="836" y="153" width="14" height="22" rx="7" opacity=".48">
      <animate attributeName="height" values="22;50;22" dur=".72s" begin="-.43s" repeatCount="indefinite"/>
      <animate attributeName="y" values="153;139;153" dur=".72s" begin="-.43s" repeatCount="indefinite"/>
    </rect>
    <rect x="862" y="145" width="14" height="38" rx="7" opacity=".74">
      <animate attributeName="height" values="38;70;38" dur=".72s" begin="-.23s" repeatCount="indefinite"/>
      <animate attributeName="y" values="145;129;145" dur=".72s" begin="-.23s" repeatCount="indefinite"/>
    </rect>
    <rect x="888" y="132" width="14" height="64" rx="7">
      <animate attributeName="height" values="64;92;64" dur=".72s" begin="-.51s" repeatCount="indefinite"/>
      <animate attributeName="y" values="132;118;132" dur=".72s" begin="-.51s" repeatCount="indefinite"/>
    </rect>
    <rect x="914" y="146" width="14" height="36" rx="7" opacity=".72">
      <animate attributeName="height" values="36;66;36" dur=".72s" begin="-.13s" repeatCount="indefinite"/>
      <animate attributeName="y" values="146;131;146" dur=".72s" begin="-.13s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- State labels follow the same idle/listening cadence as the supplied widget. -->
  <g fill="#59605c" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif">
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="5.6s" repeatCount="indefinite" keyTimes="0;.19;.29;.79;.88;1"/>
    <text x="896" y="253" text-anchor="middle" font-size="12" font-weight="900" letter-spacing="2.2">IDLE</text>
  </g>
  <g fill="#0d7b67" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="5.6s" repeatCount="indefinite" keyTimes="0;.22;.32;.77;.86;1"/>
    <text x="771" y="253" text-anchor="middle" font-size="12" font-weight="900" letter-spacing="2.2">LISTENING</text>
  </g>
</svg>
