<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="LocalFlow — 100% on-device voice to text">
  <title>LocalFlow — your voice, on your machine</title>
  <!-- neo-brutalist manga brand: Cream #FFFFEB, Ink #151914, Burnt Orange #d66a2a, Teal #0d7b67 -->
  <rect x="26" y="30" width="1150" height="300" rx="26" fill="#151914"/>
  <rect x="14" y="18" width="1150" height="300" rx="26" fill="#FFFFEB" stroke="#151914" stroke-width="5"/>

  <!-- Mic with pulsing ring -->
  <g transform="translate(0,4)">
    <circle cx="112" cy="150" r="30" fill="none" stroke="#d66a2a" stroke-width="4">
      <animate attributeName="r" values="30;62;30" dur="2.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="opacity" values="0.85;0;0.85" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="150" r="30" fill="none" stroke="#0d7b67" stroke-width="4">
      <animate attributeName="r" values="30;62;30" dur="2.2s" begin="-1.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.2 1;0.4 0 0.2 1"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.2s" begin="-1.1s" repeatCount="indefinite"/>
    </circle>
    <rect x="94" y="112" width="36" height="66" rx="18" fill="#151914"/>
    <path d="M80 152 a32 32 0 0 0 64 0" fill="none" stroke="#151914" stroke-width="6" stroke-linecap="round"/>
    <line x1="112" y1="184" x2="112" y2="202" stroke="#151914" stroke-width="6" stroke-linecap="round"/>
    <line x1="94" y1="202" x2="130" y2="202" stroke="#151914" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <text x="206" y="176" font-family="Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="-1">
    <tspan fill="#151914">Local</tspan><tspan fill="#d66a2a">Flow</tspan>
  </text>
  <!-- Tagline -->
  <text x="210" y="216" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#151914" opacity="0.78">Your voice &#183; your machine &#183; nothing leaves</text>
  <!-- On-device pill -->
  <g transform="translate(210,238)">
    <rect x="0" y="0" width="212" height="36" rx="18" fill="#151914"/>
    <circle cx="24" cy="18" r="6" fill="#d66a2a">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="42" y="24" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#FFFAF1">100% ON-DEVICE</text>
  </g>

