<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title description">
  <title id="title">LocalFlow — private voice to text</title>
  <desc id="description">The LocalFlow mark rests in a black square, slides left into a black listening capsule, reveals a live waveform, then returns to its resting state.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcfcfa"/>
      <stop offset="1" stop-color="#f1f1ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#111111" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- Brand surface -->
  <rect width="1200" height="360" fill="url(#surface)"/>
  <rect x="28" y="26" width="1144" height="308" rx="30" fill="none" stroke="#111111" stroke-opacity=".1"/>
  <path d="M72 223H466" stroke="#111111" stroke-opacity=".14"/>

  <!-- LocalFlow wordmark, matched to the supplied black brand treatment -->
  <text x="72" y="104" fill="#111111" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3.2">LOCAL VOICE SYSTEM</text>
  <text x="70" y="171" fill="#111111" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-4">LocalFlow</text>
  <text x="74" y="207" fill="#4d4d4a" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500">Press. Speak. Watch your words flow.</text>
  <g transform="translate(72 249)">
    <circle cx="7" cy="7" r="5" fill="#111111">
      <animate attributeName="opacity" values="1;.35;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="23" y="12" fill="#111111" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.9">100% ON-DEVICE</text>
  </g>

  <!--
    The idle mark begins as a black square. During the listening phase it expands
    left into a capsule; the mark travels left and exposes the live speech bars.
  -->
  <!-- Static fallback for renderers that intentionally do not run SVG animation. -->
  <g filter="url(#shadow)">
    <rect x="840" y="108" width="112" height="112" rx="32" fill="#111111"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="1;1;0;0;1;1" dur="9s" repeatCount="indefinite" keyTimes="0;.25;.33;.72;.82;1"/>
    <path d="M862 169v8c0 7 5 12 11 12s11-5 11-12v-30c0-8 5-14 12-14s12 6 12 14v62c0 8 5 14 12 14s12-6 12-14v-35c0-7 5-12 11-12s11 5 11 12v7"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="840" y="108" width="112" height="112" rx="32" fill="#111111">
      <animate attributeName="x" values="840;840;590;590;840;840" dur="9s" repeatCount="indefinite" keyTimes="0;.25;.32;.72;.82;1" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
      <animate attributeName="width" values="112;112;362;362;112;112" dur="9s" repeatCount="indefinite" keyTimes="0;.25;.32;.72;.82;1" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
      <animate attributeName="rx" values="32;32;56;56;32;32" dur="9s" repeatCount="indefinite" keyTimes="0;.25;.32;.72;.82;1"/>
    </rect>
  </g>

  <!-- LocalFlow wave-mark -->
  <g fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-250 0;-250 0;0 0;0 0" dur="9s" repeatCount="indefinite" keyTimes="0;.25;.32;.72;.82;1" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    <path d="M862 169v8c0 7 5 12 11 12s11-5 11-12v-30c0-8 5-14 12-14s12 6 12 14v62c0 8 5 14 12 14s12-6 12-14v-35c0-7 5-12 11-12s11 5 11 12v7"/>
  </g>

  <!-- Speech waveform, revealed only while the capsule is open -->
  <g fill="#ffffff">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="9s" repeatCount="indefinite" keyTimes="0;.28;.35;.69;.78;1"/>
    <rect x="732" y="156" width="14" height="16" rx="7" opacity=".48">
      <animate attributeName="height" values="16;42;16;56;16" dur=".92s" repeatCount="indefinite"/>
      <animate attributeName="y" values="156;143;156;136;156" dur=".92s" repeatCount="indefinite"/>
    </rect>
    <rect x="758" y="146" width="14" height="36" rx="7" opacity=".72">
      <animate attributeName="height" values="36;66;28;76;36" dur="1.14s" begin="-.21s" repeatCount="indefinite"/>
      <animate attributeName="y" values="146;131;150;126;146" dur="1.14s" begin="-.21s" repeatCount="indefinite"/>
    </rect>
    <rect x="784" y="132" width="14" height="64" rx="7">
      <animate attributeName="height" values="64;92;50;84;64" dur="1.03s" begin="-.47s" repeatCount="indefinite"/>
      <animate attributeName="y" values="132;118;139;122;132" dur="1.03s" begin="-.47s" repeatCount="indefinite"/>
    </rect>
    <rect x="810" y="145" width="14" height="38" rx="7" opacity=".74">
      <animate attributeName="height" values="38;70;30;60;38" dur="1.21s" begin="-.67s" repeatCount="indefinite"/>
      <animate attributeName="y" values="145;129;149;134;145" dur="1.21s" begin="-.67s" repeatCount="indefinite"/>
    </rect>
    <rect x="836" y="153" width="14" height="22" rx="7" opacity=".48">
      <animate attributeName="height" values="22;50;18;43;22" dur=".98s" begin="-.33s" repeatCount="indefinite"/>
      <animate attributeName="y" values="153;139;155;142;153" dur=".98s" begin="-.33s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Listening state copy -->
  <g fill="#ffffff" font-family="Avenir Next, Inter, Helvetica Neue, Arial, sans-serif">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="9s" repeatCount="indefinite" keyTimes="0;.31;.39;.67;.75;1"/>
    <text x="729" y="204" font-size="11" font-weight="800" letter-spacing="2.3" opacity=".65">LISTENING</text>
  </g>
</svg>
