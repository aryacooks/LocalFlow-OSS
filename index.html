<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the saved theme before first paint so there's no light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem("localflow-theme") === "dark" ? "dark" : "light";
          var el = document.documentElement;
          el.classList.remove("dark", "light");
          el.classList.add(t);
        } catch (e) {}
      })();
    </script>
    <title>LocalFlow — Local Voice-to-Text</title>
    <meta name="description" content="100% local voice-to-text for Windows. Dictate anywhere with AI cleanup, no cloud required." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
