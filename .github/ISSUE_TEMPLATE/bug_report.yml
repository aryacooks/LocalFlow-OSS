name: 🐛 Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Please do not paste anything private.** Transcripts and history may contain
        personal information — redact before pasting. For a security issue, use
        [SECURITY.md](../blob/main/SECURITY.md) instead of this form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you get instead?
      placeholder: I dictated "..." and LocalFlow typed "..." — I expected "...".
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The more exact, the faster this gets fixed.
      placeholder: |
        1. Open ...
        2. Press the hotkey and say "..."
        3. Stop recording
        4. See ...
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: LocalFlow version
      description: Shown on the About page. If you built from source, paste the commit hash.
      placeholder: "0.1.3"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the app?
      options:
        - Transcription accuracy
        - Text cleanup / punctuation / filler words
        - Text not appearing in the target app
        - Hotkey or mouse trigger
        - Recording / microphone
        - Model download
        - Settings, dashboard, or history UI
        - Install, launch, or permissions
        - Something else
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Which speech model?
      description: Shown as Active on the Language Model page.
      placeholder: "ggml-large-v3-turbo-q5_0.bin"

  - type: dropdown
    id: cleanup
    attributes:
      label: Is LLM cleanup (Formatting options) turned on?
      options:
        - "No"
        - "Yes"
        - "Not sure"

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, a recording of the bubble, or console output all help.
