  - name: 🛠️ Building from source
    url: https://github.com/aryacooks/LocalFlow-OSS/blob/main/CONTRIBUTING.md
    about: Dev setup, project layout, and how to run the checks before a pull request.
  - name: 🔒 Security vulnerability
    url: https://github.com/aryacooks/LocalFlow-OSS/blob/main/SECURITY.md
    about: Please report security problems privately, not as a public issue.
